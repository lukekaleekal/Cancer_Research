<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Izhikevich Neuron</title><style>
:root{color-scheme:light dark;--foreground:light-dark(#222,#eee);--background:light-dark(#fff,#171717);--border:light-dark(#ddd,#444);--muted-foreground:light-dark(#626262,#bbb);--viz-series-1:light-dark(#1969b5,#70b8ff);--viz-series-2:light-dark(#b05910,#ffb971)}
body{font:16px system-ui,sans-serif;background:var(--background);color:var(--foreground);max-width:850px;margin:32px auto;padding:0 16px}button,input,select{font:inherit}button,select{padding:8px 12px}button{cursor:pointer}h3{font-weight:500}.viz-row,.viz-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.form-label{display:flex;flex-direction:column;gap:6px;max-width:100%}.text-small{font-size:13px}.params{overflow-wrap:anywhere}.tabular-nums{font-variant-numeric:tabular-nums}.form-range{width:100%}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--viz-series-1);outline-offset:3px}
</style></head><body>
<div id="izh-neuron">
<style>
#izh-neuron{color:var(--foreground)}#izh-neuron .plot{width:100%;height:290px;display:block}#izh-neuron svg text{fill:var(--foreground);font-size:12px}#izh-neuron .params{margin:12px 0}#izh-neuron .live{min-height:24px}
</style>
<h3>Izhikevich neuron</h3>
<div class="viz-controls">
<label class="form-label">Firing pattern<select class="form-select" id="izh-type"><option value="rs">Regular spiking</option><option value="ib">Bursting</option><option value="ch">Chattering</option><option value="fs">Fast spiking</option></select></label>
<label class="form-label">Input current I: <output id="izh-current-value">10</output> (model units)<input class="form-range" id="izh-current" type="range" min="0" max="30" step="0.5" value="10"></label>
</div>
<div class="viz-row"><button class="btn btn-primary" id="izh-play" type="button">Play</button><button class="btn" id="izh-restart" type="button">Restart</button><span class="text-small">Playback: 100 ms of simulation per second</span></div>
<div class="text-small params" id="izh-params"></div>
<svg class="plot" id="izh-plot" role="img" aria-label="Animated membrane voltage trace over a 500 millisecond simulation"></svg>
<div class="live tabular-nums" id="izh-live" aria-live="polite"></div>
<script>
(()=>{
const root=document.getElementById('izh-neuron'),q=s=>root.querySelector(s),svg=q('#izh-plot'),NS='http://www.w3.org/2000/svg';
const presets={rs:[.02,.2,-65,8],ib:[.02,.2,-55,4],ch:[.02,.2,-50,2],fs:[.1,.2,-65,2]};
let points=[],spikes=[],params=presets.rs,t=0,running=false,last=null,raf=null,path,dot,width=600;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function el(tag,attrs,text){let e=document.createElementNS(NS,tag);Object.entries(attrs||{}).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
function simulate(){params=presets[q('#izh-type').value];let[a,b,c,d]=params,v=-65,u=b*v,I=+q('#izh-current').value;points=[{t:0,v}];spikes=[];const dt=.1;for(let i=1;i<=5000;i++){let now=i*dt,input=now>=50?I:0;let dv=.04*v*v+5*v+140-u+input,du=a*(b*v-u);v+=dt*dv;u+=dt*du;if(v>=30){points.push({t:now,v:30});spikes.push(now);v=c;u+=d;points.push({t:now,v});}else points.push({t:now,v});}q('#izh-params').textContent=`a = ${a} · b = ${b} · c = ${c} mV · d = ${d} · Current begins at 50 ms`;
}
const x=v=>64+(width-82)*v/500,y=v=>20+(230-20)*(35-v)/125;
function frame(){svg.replaceChildren();width=Math.max(300,svg.getBoundingClientRect().width);svg.setAttribute('viewBox',`0 0 ${width} 290`);el('title',{},'Membrane voltage versus time');el('rect',{x:64,y:20,width:width-82,height:210,fill:'none',stroke:'var(--border)','data-chart-frame':''});[-80,-40,0,30].forEach(v=>{el('line',{x1:64,x2:width-18,y1:y(v),y2:y(v),stroke:'var(--border)'});el('text',{x:56,y:y(v)+4,'text-anchor':'end'},v)});[0,250,500].forEach(v=>el('text',{x:x(v),y:250,'text-anchor':v===500?'end':'middle'},v));el('text',{x:(width+46)/2,y:278,'text-anchor':'middle',class:'axis-title','data-axis':'x'},'Time (ms)');el('text',{transform:'translate(16 125) rotate(-90)','text-anchor':'middle',class:'axis-title','data-axis':'y'},'Voltage (mV)');el('line',{x1:x(50),x2:x(50),y1:20,y2:230,stroke:'var(--muted-foreground)','stroke-dasharray':'3 4'});path=el('path',{fill:'none',stroke:'var(--viz-series-1)','stroke-width':2});dot=el('circle',{r:4,fill:'var(--viz-series-1)'});draw();}
function draw(){if(!path||!dot)return;t=Number.isFinite(t)?Math.max(0,Math.min(500,t)):0;let shown=points.filter(p=>p.t<=t);if(!shown.length){path.setAttribute('d','');dot.setAttribute('visibility','hidden');return;}dot.setAttribute('visibility','visible');path.setAttribute('d',shown.map((p,i)=>`${i?'L':'M'}${x(p.t).toFixed(2)},${y(p.v).toFixed(2)}`).join(''));let p=shown[shown.length-1];dot.setAttribute('cx',x(p.t));dot.setAttribute('cy',y(p.v));}
function status(){q('#izh-live').textContent=`${Math.round(t)} / 500 ms · ${spikes.filter(s=>s<=t).length} spikes`;}
function stop(){running=false;if(raf!==null)cancelAnimationFrame(raf);raf=null;last=null;q('#izh-play').textContent=t>=500?'Replay':'Play';status();}
function tick(now){if(!running)return;const delta=last===null?0:Math.max(0,Math.min(now-last,100));t=Math.min(500,t+delta*.1);last=now;draw();if(t>=500)stop();else raf=requestAnimationFrame(tick);}
function play(){if(running){stop();return;}if(t>=500)t=0;running=true;last=null;q('#izh-play').textContent='Pause';raf=requestAnimationFrame(tick);}
function reset(){stop();t=0;simulate();frame();status();}
q('#izh-play').onclick=play;q('#izh-restart').onclick=reset;q('#izh-type').onchange=reset;q('#izh-current').oninput=()=>{q('#izh-current-value').textContent=q('#izh-current').value;reset();};new ResizeObserver(frame).observe(svg);simulate();frame();status();if(!reduced)play();
})();
</script>
</div>

</body></html>
