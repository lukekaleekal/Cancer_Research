<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Depolarizing After Potential</title><style>
:root{color-scheme:light dark;--foreground:light-dark(#222,#eee);--background:light-dark(#fff,#171717);--border:light-dark(#ddd,#444);--muted-foreground:light-dark(#626262,#bbb);--viz-series-1:light-dark(#1969b5,#70b8ff);--viz-series-2:light-dark(#b05910,#ffb971)}
body{font:16px system-ui,sans-serif;background:var(--background);color:var(--foreground);max-width:850px;margin:32px auto;padding:0 16px}button,input,select{font:inherit}button,select{padding:8px 12px}button{cursor:pointer}h3{font-weight:500}.viz-row,.viz-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.form-label{display:flex;flex-direction:column;gap:6px;max-width:100%}.text-small{font-size:13px}.params{overflow-wrap:anywhere}.tabular-nums{font-variant-numeric:tabular-nums}.form-range{width:100%}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--viz-series-1);outline-offset:3px}
</style></head><body>
<div id="dap-demo">
<style>
#dap-demo{color:var(--foreground)}#dap-demo svg{display:block;width:100%}#dap-demo svg text{fill:var(--foreground);font-size:12px}#dap-demo .voltage{height:255px}#dap-demo .current{height:135px}#dap-demo .state{margin:12px 0;min-height:24px}
</style>
<h3>Depolarizing after-potential</h3>
<div class="viz-row"><button type="button" class="btn btn-primary" id="dap-play">Play</button><span class="text-small">Schematic · slowed playback</span></div>
<div class="state" id="dap-state" aria-live="polite">Resting</div>
<svg class="voltage" id="dap-voltage" role="img" aria-label="Schematic voltage trace: main spike followed by a smaller depolarizing after-potential"></svg>
<svg class="current" id="dap-current" role="img" aria-label="Brief positive input preceding the main spike"></svg>
<script>
(()=>{
const root=document.getElementById('dap-demo'),q=s=>root.querySelector(s),NS='http://www.w3.org/2000/svg';
const data=[];
// Illustrative trace matching the supplied figure, not a numerical model fit.
const anchors=[[0,-70],[9,-70],[10,-67],[11,-60],[12,-40],[12.7,30],[13,-60],[14,-59],[16,-55],[18,-53],[20,-54],[23,-59],[27,-66],[32,-69],[40,-70],[80,-70]];
for(let j=0;j<anchors.length-1;j++){const [t0,v0]=anchors[j],[t1,v1]=anchors[j+1];for(let i=0;i<30;i++){const f=i/30,e=(j>=7)?f*f*(3-2*f):f;data.push({t:t0+(t1-t0)*f,v:v0+(v1-v0)*e});}}data.push({t:80,v:-70});
const minV=Math.min(...data.map(p=>p.v))-5,maxV=35;
let time=0,running=false,last=null,raf=null,plots=[];
const button=q('#dap-play');
function build(svg,voltage){const w=Math.max(280,svg.getBoundingClientRect().width),h=voltage?255:135,top=12,bottom=h-48;
 svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
 function el(tag,attrs,text){const e=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;svg.appendChild(e);return e;}
 const x=t=>64+(w-82)*t/80,y=z=>voltage?top+(bottom-top)*(maxV-z)/(maxV-minV):top+(bottom-top)*(1.3-z)/1.6;
 el('title',{},voltage?'Membrane voltage':'Applied current');
 el('rect',{x:64,y:top,width:w-82,height:bottom-top,fill:'none',stroke:'var(--border)'});
 el('rect',{x:x(10),y:top,width:x(12)-x(10),height:bottom-top,fill:'var(--viz-series-2)',opacity:.1});
 (voltage?[-80,-40,0,30]:[0,1]).forEach(z=>{el('text',{x:56,y:y(z)+4,'text-anchor':'end'},z);el('line',{x1:64,x2:w-18,y1:y(z),y2:y(z),stroke:'var(--border)'});});
 [0,40,80].forEach(t=>el('text',{x:x(t),y:bottom+19,'text-anchor':t===80?'end':'middle'},t));
 el('text',{x:(w+46)/2,y:h-6,'text-anchor':'middle',class:'axis-title','data-axis':'x'},'Time (schematic)');
 el('text',{transform:`translate(16 ${(top+bottom)/2}) rotate(-90)`,'text-anchor':'middle',class:'axis-title','data-axis':'y'},voltage?'Voltage (mV)':'Input (relative)');
 const path=el('path',{fill:'none',stroke:voltage?'var(--viz-series-1)':'var(--viz-series-2)','stroke-width':2});
 const guide=el('line',{x1:64,x2:64,y1:top,y2:bottom,stroke:'var(--muted-foreground)','stroke-dasharray':'3 4'});
 return {path,guide,x,y,voltage};
}
function draw(){time=Number.isFinite(time)?Math.max(0,Math.min(80,time)):0;for(const p of plots){const pts=p.voltage?data.filter(d=>d.t<=time):[{t:0,v:0},...[{t:10,v:0},{t:10,v:1},{t:12,v:1},{t:12,v:0}].filter(d=>d.t<=time),{t:time,v:time>=10&&time<12?1:0}];p.path.setAttribute('d',pts.map((d,i)=>`${i?'L':'M'}${p.x(d.t).toFixed(2)},${p.y(d.v).toFixed(2)}`).join(''));p.guide.setAttribute('x1',p.x(time));p.guide.setAttribute('x2',p.x(time));}
 const label=time<10?'Resting':time<12?'Brief excitatory input':time<13?'Main spike':time<25?'Depolarizing after-potential (DAP)':time<40?'Returning toward rest':'Resting';
 if(q('#dap-state').textContent!==label)q('#dap-state').textContent=label;
}
function layout(){plots=[build(q('#dap-voltage'),true),build(q('#dap-current'),false)];draw();}
function stop(){running=false;if(raf!==null)cancelAnimationFrame(raf);raf=null;last=null;button.textContent=time>=80?'Replay':'Play';}
function tick(now){if(!running)return;const dt=last===null?0:Math.max(0,Math.min(100,now-last));last=now;time=Math.min(80,time+dt*.01);draw();if(time>=80)stop();else raf=requestAnimationFrame(tick);}
button.onclick=()=>{if(running){stop();return;}if(time>=80)time=0;running=true;last=null;button.textContent='Pause';raf=requestAnimationFrame(tick);};
layout();new ResizeObserver(layout).observe(root);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)button.onclick();
})();
</script>
</div>

</body></html>
